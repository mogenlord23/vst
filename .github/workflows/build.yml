name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_DIR: build
      CONFIG: Release
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          & $vswhere -all -products * -format text -property displayName
          # Preferred: Visual Studio 2022 generator. Newer runner images only ship VS 2026;
          # then use its generator with the VS 2022 (v143) toolset when present.
          $vs2022 = & $vswhere -all -products * -version "[17.0,18.0)" -property installationPath
          if ($vs2022) {
            cmake -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 -DMUTAFORM_BUILD_TESTS=ON
          } else {
            $v143 = Get-ChildItem -Directory -ErrorAction SilentlyContinue "${env:ProgramFiles}/Microsoft Visual Studio/*/*/MSBuild/Microsoft/VC/*/Platforms/x64/PlatformToolsets/v143"
            if ($v143) { $toolset = @("-T", "v143") } else { $toolset = @() }
            Write-Host "VS 2022 not found; using VS 2026 generator $toolset"
            cmake -B $env:BUILD_DIR -G "Visual Studio 18 2026" -A x64 @toolset -DMUTAFORM_BUILD_TESTS=ON
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config $env:CONFIG --parallel 4 --target Mutaform_VST3 Mutaform_Standalone MutaformFX_VST3 MutaformTests

      - name: Unit tests
        shell: pwsh
        run: |
          & "$env:BUILD_DIR/$env:CONFIG/MutaformTests.exe" --reporter console --durations no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          $plugins = @("$env:BUILD_DIR/Mutaform_artefacts/$env:CONFIG/VST3/Mutaform.vst3",
                       "$env:BUILD_DIR/MutaformFX_artefacts/$env:CONFIG/VST3/Mutaform FX.vst3")
          $i = 0
          foreach ($pl in $plugins) {
            $vst3 = (Resolve-Path $pl).Path
            $i++
            # pluginval.exe is a GUI-subsystem app: wait for it explicitly and capture its output.
            $args = @("--strictness-level", "10", "--validate-in-process", "--timeout-ms", "900000",
                      "--output-dir", "pluginval-logs", "--validate", "`"$vst3`"")
            $p = Start-Process -FilePath ./pluginval/pluginval.exe -ArgumentList $args -NoNewWindow -Wait -PassThru `
                   -RedirectStandardOutput "pluginval-logs/stdout$i.txt" -RedirectStandardError "pluginval-logs/stderr$i.txt"
            Get-Content "pluginval-logs/stdout$i.txt"
            Get-Content "pluginval-logs/stderr$i.txt"
            Write-Host "pluginval exit code for ${vst3}: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit 1 }
            if (-not (Select-String -Path "pluginval-logs/stdout$i.txt" -Pattern "SUCCESS" -Quiet)) {
              Write-Host "pluginval did not report SUCCESS"; exit 1
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/Mutaform-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "$env:BUILD_DIR/Mutaform_artefacts/$env:CONFIG/VST3/Mutaform.vst3" $out
          Copy-Item -Recurse "$env:BUILD_DIR/MutaformFX_artefacts/$env:CONFIG/VST3/Mutaform FX.vst3" $out
          Copy-Item "$env:BUILD_DIR/Mutaform_artefacts/$env:CONFIG/Standalone/Mutaform.exe" $out
          if (Test-Path README.md) { Copy-Item README.md $out }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Mutaform-win64
          path: dist/Mutaform-win64/
          if-no-files-found: error

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore
